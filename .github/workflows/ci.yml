name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # The JDKs Gradle runs on; the bytecode stays release 11.
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v5

      # The functional tests run Gradle 8 and 9 through TestKit, and a real Maven.
      - name: Build and test
        run: ./gradlew build
